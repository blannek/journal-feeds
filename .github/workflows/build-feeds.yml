name: Build ACS journal feeds

on:
  schedule:
    - cron: "17 3 * * *"  # ~daily, off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feeds
        run: python scripts/build_feeds.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update ACS feeds $(date -u +%Y-%m-%d)"
          git push
