name: Build journal and conference feeds

on:
  schedule:
    - cron: "30 0 * * *"  # 00:30 UTC = 08:30 China Standard Time (UTC+8)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ACS feeds
        run: python scripts/build_feeds.py

      - name: Build arXiv venue feeds
        run: python scripts/build_arxiv_feeds.py

      # Each build step above still exits non-zero (and the job still shows
      # as failed, so the failure email fires) if a single journal/venue
      # keeps failing after its retries - but that shouldn't block the
      # feeds that DID succeed from being published, so these two steps run
      # regardless.
      - name: Build index page
        if: always()
        run: python scripts/build_index.py

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
